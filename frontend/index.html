<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargo Passport</title>
<!-- Spec: docs/ui-ux.md. Data: backend/API.md. Open with ?cargo=<slug>&route=<route id> (what the QR code encodes);
     ?api=<url> points at another backend. -->
<style>
  :root { --bg:#0b1628; --card:#13233d; --line:#22385c; --fg:#ffffff; --soft:#ffd3a6; --muted:#9fb0c8; --accent:#ff8c1a;
          --found:#4fb3ff; --gap:#ff5a45; --none:#6b7c96; --nohaz:#3ccf8e; --match:#3ccf8e; --differs:#ff5a45; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:20px; }
  a { color:var(--accent); }
  button { font:inherit; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:12px; color:var(--muted); gap:12px; }
  .brand { color:var(--accent); font-weight:700; letter-spacing:.08em; text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .mono { font-family:Consolas, monospace; }
  .small { font-size:12px; color:var(--muted); }
  .tag { font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--muted); margin-left:4px; white-space:nowrap; }
  .msg { padding:40px; text-align:center; color:var(--muted); }
  .err { color:var(--gap); }
  h2 { margin:0 0 10px; font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
  /* overview */
  .ov { display:grid; grid-template-columns:1.25fr 1fr; gap:14px; }
  .ov h1 { margin:4px 0 4px; font-size:28px; }
  .items { list-style:none; padding:0; margin:12px 0 0; font-size:13px; }
  .items li { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); color:var(--soft); }
  .items li span:last-child { color:var(--muted); white-space:nowrap; }
  .side { display:grid; grid-template-rows:auto 1fr 1fr; gap:10px; }
  .side .card { display:flex; flex-direction:column; justify-content:center; padding:14px 16px; }
  .side h3 { margin:0 0 4px; font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; font-weight:600; }
  .big { font-size:18px; font-weight:600; }
  a.details { border-color:var(--accent); text-decoration:none; color:var(--fg); }
  a.details:hover, a.details:focus-visible { background:#182b4b; }
  a.details .big { color:var(--accent); }
  /* details */
  .env { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .chip { background:none; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--soft); cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#0b1628; font-weight:700; }
  .chip.here { border-color:var(--soft); }
  .diff { display:flex; flex-wrap:wrap; gap:10px 0; margin-bottom:14px; }
  .diff .lead { font-size:12px; color:var(--muted); min-width:220px; padding-right:14px; }
  .diff .lead b { color:var(--fg); display:block; font-size:14px; }
  .delta { border-left:1px solid var(--line); padding:0 14px; font-size:12px; color:var(--muted); }
  .delta b { display:block; color:var(--fg); font-size:15px; margin-top:2px; }
  .delta .same { color:var(--muted); }
  .up { color:var(--gap); } .dn { color:var(--accent); }
  .dg { display:grid; grid-template-columns:360px 1fr 1fr; gap:14px; align-items:start; }
  .legend { list-style:none; padding:0; margin:10px 0 0; font-size:12px; }
  .legend li { display:flex; align-items:baseline; gap:8px; padding:4px 0; color:var(--soft); }
  .legend i { width:10px; height:10px; border-radius:2px; flex:none; }
  .legend em { margin-left:auto; font-style:normal; font-weight:700; font-size:11px; white-space:nowrap; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; font-weight:600; color:var(--muted); font-size:11px; padding:0 4px 6px; }
  td { padding:7px 4px; border-bottom:1px dashed var(--line); vertical-align:top; color:var(--soft); }
  td:first-child { color:var(--fg); }
  td.agent { color:var(--accent); font-weight:600; }
  .ev { font-size:12px; padding:8px 0; border-bottom:1px dashed var(--line); color:var(--soft); }
  .ev b { color:var(--accent); }
  .c-match { color:var(--match); } .c-differs { color:var(--differs); } .c-unknown { color:var(--muted); }
  .lim { margin:6px 0 0; padding-left:18px; font-size:11px; color:var(--muted); }
  @media (max-width:900px) { .ov, .dg { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main id="app"><p class="msg">Loading cargo passport…</p></main>
<script>
const params = new URLSearchParams(location.search);
// shortcut: API URL comes from ?api= or defaults to the local backend; set the Vercel URL here once it is deployed.
const API = params.get('api') || 'http://localhost:8000';
const DEFAULT_ROUTE = 'R23'; // ISS → NASA lunar surface base, used when the QR code carries no route
const DIMS = [['pressure_kpa', 'Pressure'], ['o2_fraction', 'Oxygen'], ['temperature_c', 'Temperature'], ['co2_fraction', 'CO₂']];
const STATUS = {
  evidence_found: ['Evidence found', 'var(--found)'],
  gap: ['Gap', 'var(--gap)'],
  unassessed: ['Not assessed', 'var(--none)'],
  attributed_no_hazard: ['No hazard (attributed)', 'var(--nohaz)'],
};
// Reference agents per material type. Not from PSI or the backend; see docs/ui-ux.md, Panel B.
const AGENTS = {
  electrical: ['CO₂', 'Cut power first'],
  polymer: ['Water-based foam', 'CO₂'],
  fabric: ['Water-based foam', 'Water mist'],
  elastomer: ['CO₂', 'Water-based foam'],
};

const state = { cargo: null, route: null, envs: {}, materials: {}, current: null, dest: null, selected: null, results: {}, error: null };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => Math.round(x * 100) + ' %';

async function call(path, body) {
  const r = await fetch(API + path, body ? { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) } : undefined);
  if (!r.ok) throw new Error(`${path}: ${r.status} ${(await r.json().catch(() => ({}))).detail ?? ''}`);
  return r.json();
}

function extinguisher(comp, materials) {
  const text = `${comp.name} ${comp.original_label}`;
  if (/batter|lithium|li-ion|wire|wiring|electr|circuit/i.test(text)) return AGENTS.electrical;
  return AGENTS[materials[comp.material_id]?.material_class] || ['Not listed', 'Check vehicle procedure'];
}

function fmtValue(dim, eff) {
  if (!eff || eff.min == null) return 'unknown';
  const f = v => dim.endsWith('_fraction') ? +(v * 100).toFixed(1) : +(+v).toFixed(1);
  const unit = { pressure_kpa:' kPa', o2_fraction:' %', co2_fraction:' %', temperature_c:' °C' }[dim];
  return (eff.max == null || eff.max === eff.min ? f(eff.min) : `${f(eff.min)}–${f(eff.max)}`) + unit;
}

function gravityText(env) {
  if (!env) return 'unknown';
  if (env.gravity_regime === 'microgravity') return 'µg';
  return env.gravity_g != null ? `${+(+env.gravity_g).toFixed(2)} g` : env.gravity_regime;
}

// Differences between the cargo's current location and the selected environment (both compare responses).
function conditionChanges(cur, sel) {
  const rows = DIMS.map(([dim, label]) => {
    const a = cur.conditions[dim]?.effective, b = sel.conditions[dim]?.effective;
    const from = fmtValue(dim, a), to = fmtValue(dim, b);
    const mid = e => (e.min + (e.max ?? e.min)) / 2;
    const dir = a?.min != null && b?.min != null && mid(a) !== mid(b) ? (mid(b) > mid(a) ? 'up' : 'dn') : '';
    return { label, from, to, dir, same: from === to };
  });
  const g = [gravityText(cur.environment), gravityText(sel.environment)];
  rows.push({ label:'Gravity', from:g[0], to:g[1], dir:'', same:g[0] === g[1] });
  return rows;
}

const topCounts = comp => comp.ranked.find(r => r.evidence_class !== 'analogue')?.counts;
const countText = c => c ? `${c.match}/${c.differs}/${c.unknown}` : '–';

function evidenceChanges(cur, sel) {
  const a = cur.coverage.fire.components, b = sel.coverage.fire.components;
  return sel.components.flatMap((comp, i) => {
    const s0 = a[i]?.status, s1 = b[i]?.status, c0 = countText(topCounts(cur.components[i])), c1 = countText(topCounts(comp));
    if (s0 === s1 && c0 === c1) return [];
    return [{ name: comp.name, text: s0 !== s1 ? `${STATUS[s0]?.[0] ?? s0} → ${STATUS[s1]?.[0] ?? s1}` : `match/differs/unknown ${c0} → ${c1}` }];
  });
}

// Donut slices: size = mass share, colour = fire coverage status. Circumference of r=80 is 502.65.
function donutSegments(components, statuses) {
  const C = 2 * Math.PI * 80, total = components.reduce((s, c) => s + (+c.mass_share || 0), 0) || 1;
  let at = 0;
  return components.map((c, i) => {
    const len = (+c.mass_share || 0) / total * C, seg = { status: statuses[i], dash: Math.max(len - 2, 0), offset: -at };
    at += len;
    return seg;
  });
}

function spaceOf(envId) {
  const spaces = Object.keys(state.envs[envId]?.spaces || {});
  return spaces.includes('cabin') ? 'cabin' : spaces[0] || 'cabin';
}

async function compare(envId) {
  if (!state.results[envId]) {
    state.results[envId] = call('/scenarios/compare', { cargo_slug: state.cargo.slug,
      scenario: { environment_id: envId, space: spaceOf(envId), use_state: 'stowed', route_id: state.route?.id } })
      .catch(e => { delete state.results[envId]; throw e; });
  }
  return state.results[envId];
}

async function load() {
  try {
    const [list, envs, routes, materials] = await Promise.all([call('/cargo'), call('/environments'), call('/routes'), call('/materials')]);
    envs.forEach(e => state.envs[e.id] = e);
    materials.forEach(m => state.materials[m.id] = m);
    const slug = params.get('cargo') || list[0]?.slug;
    if (!slug) throw new Error('No cargo in the database.');
    state.cargo = await call('/cargo/' + encodeURIComponent(slug));
    state.route = routes.find(r => r.id === (params.get('route') || DEFAULT_ROUTE)) || null;
    state.current = state.route?.from_env;
    state.dest = state.route?.to_env;
    state.selected = state.dest || state.current || envs[0]?.id;
  } catch (e) {
    state.error = e.message.includes('404') ? 'Cargo not found. Scan the QR code again.' : `Could not reach the Cargo Passport API (${e.message}).`;
  }
  render();
}

function render() {
  const app = document.getElementById('app');
  if (state.error) { app.innerHTML = `<p class="msg err">${esc(state.error)}</p>`; return; }
  if (!state.cargo) return;
  if (location.hash === '#details') renderDetails(app); else renderOverview(app);
}

function renderOverview(app) {
  const c = state.cargo, env = id => state.envs[id];
  app.innerHTML = `
    <div class="bar"><span class="brand">CARGO PASSPORT</span><span>${esc(c.provenance)} data</span></div>
    <div class="ov">
      <section class="card" aria-label="Cargo">
        <div class="mono small">ID ${esc(c.slug)} · v${esc(c.config_version)}</div>
        <h1>${esc(c.name)}</h1>
        <div class="small">${esc(c.purpose)}</div>
        <ul class="items">${c.components.map(k => `<li><span>${esc(k.name)} · ${esc(k.original_label)}</span><span>${k.mass_share != null ? pct(k.mass_share) + ' of mass' : 'mass unknown'}</span></li>`).join('')}</ul>
      </section>
      <div class="side">
        <a class="card details" href="#details"><h3>More details</h3><div class="big">Fire evidence &amp; response →</div><span class="small" id="dest-summary">Loading evidence…</span></a>
        <section class="card"><h3>Current location</h3><div class="big">${esc(env(state.current)?.name ?? 'Not set')}</div><div class="small">${esc(state.route?.description ?? '')}</div></section>
        <section class="card"><h3>Final destination</h3><div class="big">${esc(env(state.dest)?.name ?? 'Not set')}</div><div class="small">${state.dest ? 'Gravity ' + esc(gravityText(env(state.dest))) : ''}${state.route ? ` · route ${esc(state.route.id)}` : ''}</div></section>
      </div>
    </div>`;
  if (state.dest) compare(state.dest).then(r => {
    const s = r.coverage.fire.summary, el = document.getElementById('dest-summary');
    if (el) el.textContent = `At destination: fire evidence for ${s.evidence_found} of ${s.denominator} ${s.denominator_label}, ${s.gap} gap(s)`;
  }).catch(e => { const el = document.getElementById('dest-summary'); if (el) el.textContent = 'Evidence unavailable: ' + e.message; });
}

async function renderDetails(app) {
  const c = state.cargo, sel = state.selected;
  const chips = Object.values(state.envs).map(e => `<button class="chip${e.id === state.current ? ' here' : ''}" aria-pressed="${e.id === sel}" data-env="${esc(e.id)}">${e.id === state.current ? '● ' : ''}${esc(e.name)}${e.id === state.current ? ' (current)' : ''}</button>`).join('');
  app.innerHTML = `
    <div class="bar"><span><a class="brand" href="#">← ${esc(c.slug)}</a> · ${esc(c.name)} · Fire evidence</span></div>
    <div class="env"><span class="small">Environment</span>${chips}</div>
    <div id="body"><p class="msg">Comparing evidence…</p></div>`;
  app.querySelectorAll('[data-env]').forEach(b => b.addEventListener('click', () => { state.selected = b.dataset.env; render(); }));
  let selR, curR;
  try {
    [selR, curR] = await Promise.all([compare(sel), state.current ? compare(state.current).catch(() => null) : null]);
  } catch (e) {
    if (state.selected === sel) document.getElementById('body').innerHTML = `<p class="msg err">${esc(e.message)}</p>`;
    return;
  }
  if (state.selected !== sel || location.hash !== '#details') return; // user moved on while loading
  document.getElementById('body').innerHTML = diffStrip(curR, selR) + `<div class="dg">${donutPanel(selR)}${extinguisherPanel(selR)}${evidencePanel(selR)}</div>
    <div class="small" style="text-align:right;margin-top:10px">${esc(c.provenance).toUpperCase()} CARGO · EVIDENCE COMPARISON · not a safety approval</div>`;
}

function diffStrip(cur, sel) {
  const name = id => esc(state.envs[id]?.name ?? id);
  if (!cur) return `<div class="card diff"><div class="lead">No current location known for this cargo.</div></div>`;
  if (cur.environment.id === sel.environment.id) {
    return `<div class="card diff"><div class="lead">This is the cargo's current location<b>${name(sel.environment.id)}</b></div>${
      conditionChanges(sel, sel).map(r => `<div class="delta">${r.label}<b>${esc(r.to)}</b></div>`).join('')}</div>`;
  }
  const rows = conditionChanges(cur, sel), changed = rows.filter(r => !r.same);
  const same = rows.filter(r => r.same && r.to !== 'unknown'), unknownBoth = rows.filter(r => r.same && r.to === 'unknown');
  const ev = evidenceChanges(cur, sel);
  const unknown = sel.incomplete_dimensions.length ? `<span class="tag">unknown: ${esc(sel.incomplete_dimensions.join(', '))}</span>` : '';
  return `<div class="card diff">
    <div class="lead">Changes from current location<b>${name(cur.environment.id)} → ${name(sel.environment.id)}</b>${unknown}</div>
    ${changed.map(r => `<div class="delta">${r.label}<b>${esc(r.from)} → ${esc(r.to)}${r.dir ? ` <span class="${r.dir}">${r.dir === 'up' ? '▲' : '▼'}</span>` : ''}</b></div>`).join('')}
    ${same.length ? `<div class="delta">${same.map(r => r.label).join(' · ')}<b class="same">${same.map(r => esc(r.to)).join(' · ')} — no change</b></div>` : ''}
    ${unknownBoth.length ? `<div class="delta">${unknownBoth.map(r => r.label).join(' · ')}<b class="same">unknown at both</b></div>` : ''}
    <div class="delta">Evidence changes<b>${ev.length ? ev.map(e => `<span style="color:var(--soft)">${esc(e.name)}</span> ${esc(e.text)}`).join('<br>') : '<span class="same">No evidence changes</span>'}</b></div>
  </div>`;
}

function donutPanel(r) {
  const cov = r.coverage.fire, statuses = cov.components.map(x => x.status);
  const segs = donutSegments(r.components, statuses);
  const s = cov.summary;
  return `<section class="card"><h2>Cargo fire evidence</h2>
    <svg viewBox="0 0 200 200" width="200" height="200" style="display:block;margin:0 auto" role="img" aria-label="Fire evidence for ${s.evidence_found} of ${s.denominator} components">
      <g transform="rotate(-90 100 100)" fill="none" stroke-width="22">
        <circle cx="100" cy="100" r="80" stroke="var(--line)"/>
        ${segs.map(g => `<circle cx="100" cy="100" r="80" stroke="${STATUS[g.status]?.[1] ?? 'var(--none)'}" stroke-dasharray="${g.dash.toFixed(1)} 600" stroke-dashoffset="${g.offset.toFixed(1)}"/>`).join('')}
      </g>
      <text x="100" y="104" text-anchor="middle" font-size="36" font-weight="700" fill="var(--fg)">${s.evidence_found}/${s.denominator}</text>
      <text x="100" y="126" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="var(--muted)">WITH FIRE EVIDENCE</text>
    </svg>
    <ul class="legend">${r.components.map((k, i) => {
      const st = cov.components[i], n = st?.counts;
      return `<li><i style="background:${STATUS[st?.status]?.[1] ?? 'var(--none)'}"></i><span>${esc(k.name)} · ${esc(k.original_label)}<br><span class="small">${n ? `exact ${n.exact} · related ${n.related} · analogue ${n.analogue}` : ''}</span></span><em>${esc(STATUS[st?.status]?.[0] ?? st?.status)}</em></li>`;
    }).join('')}
      <li><i style="background:${STATUS[cov.assembly.status]?.[1]}"></i><span>Whole assembly<br><span class="small">${esc(cov.assembly.reason)}</span></span><em>${esc(STATUS[cov.assembly.status]?.[0] ?? cov.assembly.status)}</em></li>
    </ul>
    <div class="small" style="margin-top:8px">Slice size = mass share. ${s.gap} gap(s), ${s.unassessed} not assessed, of ${s.denominator} ${esc(s.denominator_label)}.</div>
  </section>`;
}

function extinguisherPanel(r) {
  return `<section class="card"><h2>Extinguisher per object</h2>
    <table><tr><th>Object</th><th>Extinguisher</th><th>Alternative</th></tr>
    ${r.components.map(k => { const [a, b] = extinguisher(k, state.materials); return `<tr><td>${esc(k.name)}</td><td class="agent">${a}</td><td>${b}</td></tr>`; }).join('')}
    </table>
    <div class="small" style="margin-top:8px">Reference by material type, not from PSI data. Follow the vehicle's approved procedure.</div>
  </section>`;
}

function evidencePanel(r) {
  const link = id => { const s = r.sources[id]; return s ? `<a href="${s.doi ? 'https://doi.org/' + esc(s.doi) : esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(id); };
  const rows = r.components.map(k => {
    const top = k.ranked.find(x => x.evidence_class !== 'analogue');
    if (!top) return `<div class="ev"><b>${esc(k.name)}</b> <span class="tag">gap</span><br>No PSI or material record for ${esc(k.original_label)}.</div>`;
    const o = r.observations[top.observation_id] || {}, n = top.counts;
    return `<div class="ev"><b>${esc(o.investigation_accession || 'Test record')}</b> <span class="tag">${esc(k.name)}</span><span class="tag">${esc(top.evidence_class)}</span><br>
      <span class="c-match">${n.match} match</span> · <span class="c-differs">${n.differs} differs</span> · <span class="c-unknown">${n.unknown} unknown</span><br>
      <span class="small">${esc(top.reasons.slice(0, 3).join('; '))}</span><br><span class="small">${link(o.source_id)}</span></div>`;
  }).join('');
  const analogues = new Set(r.components.flatMap(k => k.ranked.filter(x => x.evidence_class === 'analogue').map(x => x.observation_id))).size;
  return `<section class="card"><h2>Evidence · NASA PSI</h2>${rows}
    ${analogues ? `<div class="ev small">Analogue records (gas burner, not this material): ${analogues}, kept separate.</div>` : ''}
    ${r.findings.map(f => `<div class="ev">${esc(f.claim)}<br><span class="small">${link(f.source_id)}</span></div>`).join('')}
    <ul class="lim">${r.limitations.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
  </section>`;
}

window.addEventListener('hashchange', render);
load();
</script>
</body>
</html>
