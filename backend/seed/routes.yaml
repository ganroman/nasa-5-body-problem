# Cargo routes R01-R24, transcribed from prototype/cargo-environment-map.html (ROUTES).
# Prototype env ids -> seed ids: earth -> earth-logistics, gateway -> lunar-gateway,
# moon -> lunar-base-nasa, ilrs -> lunar-base-china, orbit -> martian-orbital-station-nasa,
# mars -> martian-base-nasa, rover -> lunar-rover-cabin, outside -> lunar-exterior,
# disposal -> disposal-vehicle.
# possible_cargo = prototype "contents"; description = prototype "transport" text.
# status: operating -> supported; illustrative -> hypothetical; "reference" (planning / study)
#   -> historical for the paused-Gateway routes R04-R07 (cargo-journes.md calls them "historical
#   planning references"), otherwise supported. prototype_status keeps the original label
#   because RouteStatus has no planning/study value (R12-R16 are Mars study concepts).
# W1-W5 follow cargo-journes.md "ISS departures to lunar destinations": R22 [W1][W3],
#   R23 [W2][W5], R24 [W4]; R04/R06/R07/R08/R10 share one sentence citing [W1][W2].
# prototype_status and cargo_types have no column in models.Route; the loader only validates them.

- id: R01
  from_env: earth-logistics
  to_env: iss
  status: supported
  prototype_status: operating
  cargo_types: [supplies, reserves, equipment, science]
  possible_cargo: "Food, water, gases, clothing, hygiene and medical supplies; spares, tools, batteries and experiments."
  description: "Cargo spacecraft; pressurized stowage or external carriers depending on vehicle."
  source_ids: [doc-prototype-cargo-map, doc-env-iss]

