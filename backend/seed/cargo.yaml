      - {name: Wiring, original_label: "PTFE-insulated wire", material_id: ptfe-insulated-wire-m22759, identity_confidence: related, mass_share: 0.10}
      - {name: Carry strap, original_label: "Kevlar/PBI webbing, black", material_id: kevlar-pbi-webbing-black, identity_confidence: exact, mass_share: 0.10}

