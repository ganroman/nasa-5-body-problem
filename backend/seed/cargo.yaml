# Example cargo from docs/environments/material-flammability-examples.md. Objects and mass shares
# are invented for demonstration (provenance illustrative). original_label is the doc's
# "Material (tested form)" cell, verbatim. The doc's per-station verdicts, oxygen ceilings and
# storage temperatures are deliberately not stored: comparisons are computed in code.
# identity_confidence: exact when the label is the tested form itself; related when a generic
# label is linked to a specific tested specimen; unmatched (material_id null) when no evidence.

- slug: crew-clothing-kit
  name: Crew clothing kit
  purpose: "Personal clothing for one crew member, packed in a bag."
  provenance: illustrative
  origin: seeded
  config:
    version: 1
    components:
      - {name: Garments, original_label: "Cotton, untreated", material_id: cotton-untreated, identity_confidence: exact, mass_share: 0.70}
      - {name: Stowage bag, original_label: "Nomex HT90-40, single layer", material_id: nomex-ht90-40-single-layer, identity_confidence: exact, mass_share: 0.25}
      - {name: Handles, original_label: "Kevlar/PBI webbing, natural", material_id: kevlar-pbi-webbing-natural, identity_confidence: exact, mass_share: 0.05}

- slug: portable-science-instrument
  name: Portable science instrument
  purpose: "Handheld measuring device with its own battery."
  provenance: illustrative
  origin: seeded
  config:
    version: 1
    components:
      - {name: Enclosure, original_label: "PMMA cast sheet", material_id: pmma-cast-sheet, identity_confidence: exact, mass_share: 0.40}
      - {name: Battery pack, original_label: "Lithium-ion cells (no evidence in this document)", material_id: null, identity_confidence: unmatched, mass_share: 0.30}
