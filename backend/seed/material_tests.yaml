# Earth standard-test results (MOC / LOI) from docs/environments/material-flammability-examples.md,
# stored as observations. All are ground tests (gravity_regime earth).
#   std6001_test1: an MOC "X% at Y kPa" is the highest O2 at which the material passed Test 1 at
#                  that pressure -> outcome {passed: true} at (X, Y). Higher O2 is not recorded.
#   std6001_test4: wire insulation; outcome {passed: false} where the doc says "failed".
#   astm_d2863:    LOI at about 1 atm -> outcome {loi_fraction: x}; o2_fraction and pressure_kpa
#                  stay null because LOI is a threshold, not a single test atmosphere, and the doc
#                  gives no pressure. Not interchangeable with MOC.
# Pressures are the doc's kPa conversions of psia values (8.2 psia ~ 56.5 kPa, etc.).
# source_id is the primary source only where the doc names it for that value; otherwise the repo
# doc itself, with candidate primaries in the note (the doc gives no per-value attribution).

# --- Kevlar/PBI webbings: NASA TB 26-05 ----------------------------------------------------
- material_id: kevlar-pbi-webbing-natural
  test_method: std6001_test1
  o2_fraction: 0.37
  pressure_kpa: 56.5
  o2_raw: "37%"
  pressure_raw: "56.5 kPa"
  outcome: {passed: true}
  gravity_regime: earth
  source_id: nasa-tb-26-05
  locator: "MOC 37% at 56.5 kPa (8.2 psia); transcribed via docs/environments/material-flammability-examples.md, Crew clothing kit and Crew restraint net tables"
