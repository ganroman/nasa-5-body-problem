# Environments (models.Environment) with nested conditions: {space: {dimension: value}}.
# Every space lists every Dimension, so an unknown is written down rather than left out.
# Units: o2/co2/n2 as volume fraction (20.9% -> 0.209), pressure kPa absolute, airflow m/s,
# temperature degC, relative humidity %. status unknown <=> value_min and value_max both null.
# One-sided bounds ("at least", "at most") keep the other side null.
# Lunar, Mars and Gateway cabins stay unknown: ISS values are never copied into them.

# --- Space environments (6) -------------------------------------------------------------
- id: iss
  name: International Space Station
  domain: space
  gravity_regime: microgravity
  gravity_g: null
  maturity: operating
  summary: "Crewed laboratory in low Earth orbit, roughly 400 km; continuously occupied since November 2000; NASA plans retirement around 2030."
  source_id: doc-env-iss
  doc_path: docs/environments/iss.md
  conditions:
    cabin:
      o2_fraction: {value_min: 0.21, value_max: 0.21, status: sourced, source_id: doc-env-iss, locator: "§5 Relevance to our fire-safety challenge, bullet 2", note: "'roughly 21% oxygen'; nominal, actual O2 varies within controlled ranges and between segments (Limits)."}
      pressure_kpa: {value_min: 101, value_max: 101, status: sourced, source_id: doc-env-iss, locator: "§5 Relevance to our fire-safety challenge, bullet 2", note: "'about 101 kPa'; nominal cabin value, not telemetry; controlled ranges not specified."}
      airflow_ms: {status: unknown, source_id: doc-env-dimensions, locator: "§1 ISS dimension profile, row Airflow", note: "Forced ventilation; local speeds, directions and fan states must be obtained per module."}
      temperature_c: {status: unknown, source_id: doc-env-dimensions, locator: "§1 ISS dimension profile, row Cabin temperature and humidity", note: "Numerical ranges unknown in the note."}
      relative_humidity_pct: {status: unknown, source_id: doc-env-dimensions, locator: "§1 ISS dimension profile, row Cabin temperature and humidity", note: "Numerical ranges unknown in the note."}
      co2_fraction: {status: unknown, source_id: doc-env-dimensions, locator: "§1 ISS dimension profile, row Remaining gas composition", note: "Detailed fractions unknown."}
      n2_fraction: {status: unknown, source_id: doc-env-dimensions, locator: "§1 ISS dimension profile, row Remaining gas composition", note: "Detailed fractions unknown; do not infer a mixture from the nominal O2 percentage."}

