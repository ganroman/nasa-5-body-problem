# --- Earth environments (4): analyst-selected planning estimates, not measurements --------
- id: earth-aircraft
  name: Aircraft cabins and cargo holds
  domain: earth
  gravity_regime: earth
  gravity_g: 1.0
  maturity: estimate
  summary: "Pressurised passenger aircraft in cruise; cabin and pressurised hold share the pressure assumption. Ground handling, depressurisation and unpressurised compartments are outside this baseline."
  source_id: doc-env-earth-aircraft
  doc_path: docs/environments/earth/aircraft.md
  conditions:
    cabin:
      o2_fraction: {value_min: 0.209, value_max: 0.209, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Oxygen concentration", note: "20.9% by volume, dry-gas basis; ordinary-air assumption."}
      pressure_kpa: {value_min: 75, value_max: 85, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Total gas pressure", note: "Rounded cruise scenario around the source's ~76 kPa reference; not a regulatory envelope."}
      airflow_ms: {value_min: 0.05, value_max: 0.3, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Local airflow (Cabin)", note: "Chosen low-speed comparison range; jets and ducts can be faster."}
      temperature_c: {value_min: 18, value_max: 26, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Air temperature (Cabin)", note: "Planning range."}
      relative_humidity_pct: {value_min: 10, value_max: 30, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Relative humidity (Cabin)", note: "Assumed cruise conditions."}
      co2_fraction: {status: unknown, source_id: doc-env-earth-aircraft, locator: "Paragraph after the baseline table", note: "CO2 accumulation requires separate inputs."}
      n2_fraction: {value_min: 0.78, value_max: 0.78, status: estimate, source_id: doc-env-earth-aircraft, locator: "Paragraph after the baseline table", note: "'approximate the remaining dry gas as 78% N2, 0.9% argon and trace gases'."}
    hold:
      o2_fraction: {value_min: 0.209, value_max: 0.209, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Oxygen concentration", note: "Shared ordinary-air assumption."}
      pressure_kpa: {value_min: 75, value_max: 85, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Total gas pressure", note: "Cabin and pressurised hold share the pressure assumption."}
      airflow_ms: {value_min: 0.01, value_max: 0.1, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Local airflow (sheltered hold location)", note: "Chosen low-speed comparison range."}
      temperature_c: {value_min: 5, value_max: 25, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Air temperature (selected conditioned hold)", note: "Not a guarantee for cargo or a battery's internal temperature."}
      relative_humidity_pct: {value_min: 10, value_max: 50, status: estimate, source_id: doc-env-earth-aircraft, locator: "Estimated baseline for comparison, row Relative humidity (hold scenario)", note: "Cargo moisture and ground conditions can change this substantially."}
      co2_fraction: {status: unknown, source_id: doc-env-earth-aircraft, locator: "Paragraph after the baseline table", note: "CO2 accumulation requires separate inputs."}
      n2_fraction: {value_min: 0.78, value_max: 0.78, status: estimate, source_id: doc-env-earth-aircraft, locator: "Paragraph after the baseline table", note: "Ordinary-air approximation, 78% N2."}

