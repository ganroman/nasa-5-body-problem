# Drop-in for thing-cargo-api.service: /etc/systemd/system/thing-cargo-api.service.d/admin.conf
[Service]
# ADMIN_PASSWORD=... (root, mode 600; systemd reads it, the app user cannot)
EnvironmentFile=/etc/thing/credentials/CARGO_ADMIN_PASSWORD
# Variables edited by /admin; later files override earlier ones and Environment=. The "-" makes it optional.
EnvironmentFile=-/var/lib/cargo/cargo.env
Environment=CARGO_ENV_FILE=/var/lib/cargo/cargo.env
Environment=CARGO_FLAGS_FILE=/var/lib/cargo/flags.json
Environment=CARGO_RESTART_SIGNAL=/var/lib/cargo/restart.signal
