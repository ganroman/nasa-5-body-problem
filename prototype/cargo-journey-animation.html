<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Cargo on the move · Five-Body Problem</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080e20;color:#fff;font:16px system-ui}main{max-width:1600px;margin:auto}canvas{display:block;width:100%;height:auto}nav{display:flex;align-items:center;gap:16px;padding:16px 24px}button,a{color:#fff}button{background:#26344f;border:1px solid #71809c;padding:10px 20px;border-radius:30px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffbf56}input{flex:1;accent-color:#ffbf56}p{color:#aab7cf;margin:0 24px 20px;font-size:13px}a{color:#ffbf56}</style></head>
<body><main><canvas id="film" width="1600" height="900" role="img" aria-label="Cargo travels from Earth to environments grouped on and around a visible Moon and Mars, including orbital habitats, surface bases and lunar fieldwork. Operating, planned and illustrative routes are distinguished."></canvas><nav aria-label="Animation controls"><button id="play">Pause</button><button id="restart">Replay</button><input id="seek" aria-label="Playback position in seconds" type="range" min="0" max="30" step="0.1" value="0"><span id="time">0 / 30s</span></nav><p>Bodies, distances and transfers are schematic, not to scale or flight trajectories. Route evidence follows the <a href="cargo-environment-map.html">cargo environment map</a>. Cargo is shown symbolically; it travels aboard vehicles. No safety rating is implied.</p></main>
<script>
const canvas=document.getElementById('film'),c=canvas.getContext('2d');
const ink='#18233d',white='#f4f2e9',amber='#ffbf56',muted='#a4b4d0';
const nodes={earth:[195,540,'Earth logistics','Packing & receiving','earth'],iss:[180,285,'ISS','Operating · microgravity','station'],disposal:[430,350,'Disposal vehicle','Destructive re-entry','ship'],gateway:[840,265,'Lunar Gateway','Earlier design · microgravity','station'],moon:[725,465,'NASA lunar base','Planned · 0.17g','moon'],ilrs:[950,465,'China-led ILRS','Planned · 0.17g','moon'],rover:[735,625,'Lunar rover cabin','Illustrative · 0.17g','rover'],outside:[960,625,'Lunar exterior','Illustrative · vacuum','outside'],orbit:[1350,285,'Mars orbital habitat','Study concept · microgravity','station'],mars:[1350,565,'Mars surface base','Study concept · 0.38g','mars']};
const bodies={moon:{x:840,y:555,r:225,surface:['moon','ilrs','rover','outside'],orbital:['gateway']},mars:{x:1350,y:565,r:158,surface:['mars'],orbital:['orbit']}};
const routes=[['R01','earth','iss','operating','box',0,30],['R02','iss','earth','operating','sample',0,-35],['R03','iss','disposal','operating','waste',0,-30],['R04','earth','gateway','reference','water',1,30],['R06','gateway','moon','reference','battery',1,-35],['R08','earth','moon','reference','box',1,90],['R17','moon','rover','illustrative','battery',2,-15],['R18','rover','moon','illustrative','sample',2,-40],['R19','moon','outside','illustrative','battery',2,-10],['R20','outside','moon','illustrative','battery',2,-35],['R10','earth','ilrs','reference','box',3,120],['R12','earth','orbit','reference','water',3,25],['R14','earth','mars','reference','box',3,150],['R15','orbit','mars','reference','battery',3,-20],['R16','mars','orbit','reference','sample',3,-35]];
const chapters=[['Cargo moves. Conditions change.','01 / EARTH & ORBIT','Supplies go up. Selected samples come home.','Operating ISS logistics'],['Next stop: the Moon.','02 / LUNAR LOGISTICS','Tools, water and equipment travel into new conditions.','Planning references · Gateway uses an earlier architecture'],['Outside. Inside. Changed.','03 / FIELDWORK','The same instrument returns with a different exposure history.','Illustrative local transfers · vacuum, dust and cabin conditions'],['Further from Earth. More to track.','04 / THE NEXT FRONTIER','Surface bases and orbital habitats need their own evidence.','Planning / study references · no operating Mars base'],['Same cargo. New environment.','FIVE-BODY PROBLEM / FLAME IN FREEFALL','Check again. Let the cargo passport tell its story.','Concept visualization · not a safety assessment']];
function line(points,color=ink,w=4){c.beginPath();c.moveTo(...points[0]);for(const p of points.slice(1))c.lineTo(...p);c.strokeStyle=color;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.stroke()}
function round(x,y,w,h,r,fill,stroke=ink){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke()}}
function oval(x,y,rx,ry,fill,stroke=ink){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke()}}
function text(s,x,y,size=20,color=white,align='center',weight=600){c.fillStyle=color;c.font=`${weight} ${size}px Arial, sans-serif`;c.textAlign=align;c.fillText(s,x,y)}
function panel(x,y,w=38,h=56){round(x,y,w,h,1,'#234a73','#7a9eb9');for(let i=1;i<4;i++)line([[x+w*i/4,y],[x+w*i/4,y+h]],'#7392ac',.7);for(let i=1;i<5;i++)line([[x,y+h*i/5],[x+w,y+h*i/5]],'#7392ac',.7)}
function sphere(radius,color,land=false){const g=c.createRadialGradient(-radius*.4,-radius*.4,3,0,0,radius);g.addColorStop(0,color);g.addColorStop(.7,land?'#255477':color);g.addColorStop(1,'#172538');oval(0,0,radius,radius,g,'#8bacc250');if(land){c.save();c.beginPath();c.arc(0,0,radius-2,0,7);c.clip();c.fillStyle='#6a9b9b';for(const points of [[[-68,-31],[-49,-51],[-25,-45],[-9,-26],[-29,-9],[-23,13],[-46,3]],[[-22,15],[-4,22],[1,45],[-14,64],[-26,36]],[[12,-43],[44,-42],[65,-12],[44,4],[30,-8],[14,3],[2,-15]],[[38,34],[64,33],[69,47],[45,51]]]){c.beginPath();c.moveTo(...points[0]);for(const p of points.slice(1))c.lineTo(...p);c.closePath();c.fill()}c.strokeStyle='#dceef54a';c.lineWidth=3;for(let i=0;i<3;i++){c.beginPath();c.ellipse(-9,i*22-26,60,10,-.3,.2,2.6);c.stroke()}c.restore()}}
function habitat(color){oval(0,22,87,22,color,'#a8b9c044');for(const [x,y,r] of [[-54,22,12],[51,28,9],[32,13,5]])oval(x,y,r,r*.25,'#24334944',null);line([[-41,17],[-41,29],[42,29],[42,17]],'#8097a7',3);round(-51,-19,104,42,6,'#c4ced4','#526c7f');round(-18,-42,45,64,5,'#dce2e4','#526c7f');round(-9,-23,27,20,2,'#263f55','#7798ae');round(-6,3,20,20,2,'#849aa8');for(const x of [-43,35]){round(x,-10,12,12,1,'#314c62');line([[x-2,12],[x+13,12]],'#8297a7',1)}line([[63,15],[63,-36]],'#b3c5d1',2);c.beginPath();c.ellipse(63,-40,16,5,-.5,0,7);c.fillStyle='#cbd5db';c.fill();line([[72,-45],[79,-54]],'#cbd5db',1);panel(-83,-17,24,30)}
function planetaryBody(id){const b=bodies[id];c.save();c.translate(b.x,b.y);sphere(b.r,id==='moon'?'#7f8b99':'#ba7859');c.save();c.beginPath();c.arc(0,0,b.r-2,0,7);c.clip();if(id==='moon'){for(const [x,y,r] of [[-130,-90,30],[75,-145,22],[145,-40,35],[-60,30,40],[35,160,20],[-140,135,23],[145,140,30],[40,-60,12]]){oval(x,y,r,r*.72,'#34465b40','#bcc7cd35');oval(x+3,y+3,r*.65,r*.44,'#33425630',null)}}else{for(const [x,y,rx,ry] of [[-70,-45,55,17],[45,65,60,20],[80,-50,35,30],[-50,105,30,12]])oval(x,y,rx,ry,'#764a3e55',null);oval(-5,-147,50,12,'#d9d9d0aa',null);line([[-100,17],[-45,32],[0,20],[55,36],[100,27]],'#643e3755',6)}c.restore();c.restore();c.save();c.setLineDash([4,9]);c.strokeStyle='#95abc344';c.lineWidth=1;c.beginPath();c.ellipse(b.x,b.y,b.r+35,b.r+64,0,Math.PI*1.04,Math.PI*1.96);c.stroke();c.restore()}
function environment(id,t,active){const [x,y,name,sub,type]=nodes[id];c.save();c.translate(x,y);c.save();if(id!=='earth')c.scale(.7,.7);if(active){oval(0,0,105,76,'#ffbf5606',null)}
if(type==='earth')sphere(95,'#5b9dc2',true);
if(type==='station'){c.save();c.rotate(-.12);line([[-100,0],[100,0]],'#96acbb',5);for(const x of [-102,-60,51,93]){panel(x,-55,27,44);panel(x,11,27,44)}round(-42,-14,83,28,4,'#cbd7de','#738b9e');round(-17,-37,28,74,4,id==='gateway'?'#c3b9ad':'#dce3e6','#738b9e');round(-13,-19,20,37,3,'#acbac4');for(const x of [-35,23]){line([[x,-13],[x,13]],'#617f95',1);round(x+3,-6,8,12,1,'#2b4d64')}line([[10,-26],[33,-46]],'#c4d7df',2);oval(37,-48,10,4,'#c3d0d9');round(-9,37,13,12,2,'#8299ac');c.restore()}
if(type==='moon'||type==='mars')habitat(type==='mars'?'#a66f54':'#6b7889');
if(type==='outside'){oval(0,25,80,22,'#6b7889','#8999aa');for(const [x,y,r] of [[-47,25,15],[48,20,11],[10,35,8]])oval(x,y,r,r*.3,'#465567',null);round(-20,-26,43,36,3,'#a9bac5','#50697b');round(-15,-20,18,24,1,'#273d50');line([[20,-12],[38,-22],[48,-9],[48,20]],'#c2cdd4',4);line([[-12,11],[-23,30]],'#c2cdd4',3);line([[13,11],[21,28]],'#c2cdd4',3);line([[4,-27],[4,-53]],'#9eb2bf',2);round(-2,-57,14,7,1,'#d0d9dc');panel(-43,-20,19,29)}
if(type==='rover'){for(const x of [-45,0,45]){oval(x,23,15,19,'#26313d','#8e9eaa');oval(x,23,7,10,'#758795')}round(-63,-17,127,37,5,'#bec9d0','#718899');round(-35,-49,75,36,6,'#d5dcde','#718899');round(-25,-42,49,20,2,'#2b4c62');line([[0,-42],[0,-22]],'#9aacb9',2);round(-57,-9,21,19,1,'#8c9d27');line([[48,-17],[54,-57]],'#c5d3dc',2);oval(57,-58,11,4,'#bdcbd2');round(42,-7,14,8,1,'#e5d6ac');line([[-62,16],[65,16]],'#617889',2)}
if(type==='ship'){c.save();c.rotate(-.35);panel(-8,-62,25,37);panel(-8,25,25,37);round(-48,-24,83,48,7,'#bac9d2','#7b93a5');round(-57,-15,10,30,2,'#617c92');round(33,-19,15,38,4,'#e0e5e7');for(const x of [-28,10])line([[x,-23],[x,23]],'#7c95a5',1);round(-14,-9,24,18,2,'#677e92');c.restore()}
c.restore();text(name,0,id==='earth'?125:65,id==='earth'?24:19);text(sub,0,id==='earth'?148:86,13,muted,'center',400);c.restore()}
function cargo(kind,x,y,t,scale=1){c.save();c.translate(x,y);c.scale(scale,scale);c.shadowColor='#030915';c.shadowBlur=14;c.shadowOffsetY=5;
if(kind==='battery'){round(-23,-31,46,62,3,'#8eaaa3','#d0dbd6');c.shadowBlur=0;round(-12,-37,8,6,1,'#d9dfe0');round(5,-37,8,6,1,'#d9dfe0');round(-15,-22,30,27,1,'#334b51');text('+',0,-3,21,'#b5d1c3');for(let y=13;y<25;y+=5)line([[-13,y],[13,y]],'#526e70',1)}
else if(kind==='water'){round(-20,-31,40,62,10,'#88a8bf','#c3d5df');c.shadowBlur=0;round(-9,-39,18,9,2,'#d0d8db');line([[-18,-14],[18,-14]],'#bed5e2',2);line([[-18,16],[18,16]],'#bed5e2',2);text('H₂O',0,7,13,'#15344b')}
else if(kind==='sample'){round(-25,-28,50,57,3,'#b3a892','#d4d1c8');c.shadowBlur=0;round(-27,-33,54,10,2,'#d0d4d3');round(-17,-16,34,24,1,'#364a59');text('SAMPLE',0,-1,8,'#dfebec');line([[-18,19],[18,19]],'#6c777c',2)}
else{round(-33,-26,66,52,4,kind==='waste'?'#7a8996':'#b99962','#e1d1b0');c.shadowBlur=0;round(-13,-34,26,8,2,'#6f7d87');round(-27,-18,54,35,1,kind==='waste'?'#566471':'#806d50');for(const x of [-23,20])round(x,-28,6,12,1,'#d5d8d6');round(-12,-11,24,20,1,'#e4e0d3');text(kind==='waste'?'USED':'CARGO',0,1,7,ink);for(let i=0;i<8;i++)line([[-9+i*2,4],[-9+i*2,8]],ink,i%3===0?2:1)}c.restore()}
function point(r,p){const a=nodes[r[1]],b=nodes[r[2]],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-r[6];return [(1-p)**2*a[0]+2*(1-p)*p*mx+p*p*b[0],(1-p)**2*a[1]+2*(1-p)*p*my+p*p*b[1]]}
function draw(t){t=Math.max(0,Math.min(30,t));const chapter=Math.min(4,Math.floor(t/6)),copy=chapters[chapter];c.fillStyle='#0a1225';c.fillRect(0,0,1600,900);const g=c.createRadialGradient(900,450,60,900,450,900);g.addColorStop(0,'#253451');g.addColorStop(1,'#0a1225');c.fillStyle=g;c.fillRect(0,0,1600,900);for(let i=0;i<125;i++){const x=(i*307+41)%1600,y=(i*i*73+17)%900;oval(x,y,i%4===0?1.8:1,1,'#cbd9f0',null)}
text('FIVE-BODY PROBLEM  /  FLAME IN FREEFALL',65,44,15,amber,'left');text(copy[0],65,108,48,white,'left');text('CARGO / ENVIRONMENT / EXPOSURE',1535,44,13,muted,'right');
planetaryBody('moon');planetaryBody('mars');text('EARTH',195,782,18,muted);text('MOON',840,792,18,white);text('MARS',1350,782,18,white);
for(const r of routes){const active=chapter===4||r[5]===chapter;c.globalAlpha=active?.65:.08;c.beginPath();c.moveTo(...point(r,0));const a=nodes[r[1]],b=nodes[r[2]];c.quadraticCurveTo((a[0]+b[0])/2,(a[1]+b[1])/2-r[6],b[0],b[1]);c.strokeStyle=r[3]==='operating'?'#7fddbb':r[3]==='reference'?amber:'#c7b4f0';c.lineWidth=active?3:2;c.setLineDash(r[3]==='operating'?[]:r[3]==='reference'?[10,9]:[2,9]);c.stroke();c.setLineDash([])}c.globalAlpha=1;
for(const id of Object.keys(nodes))environment(id,t,routes.some(r=>(chapter===4||r[5]===chapter)&&(r[1]===id||r[2]===id)));
for(let i=0;i<routes.length;i++){const r=routes[i];if(chapter!==4&&r[5]!==chapter)continue;const p=((t%6)/6*1.35+i*.23)%1;const [x,y]=point(r,p*p*(3-2*p));cargo(r[4],x,y,t+i,.72);}
round(54,810,1492,70,18,'#101c33','#344563');text(copy[1],78,839,13,amber,'left');text(copy[2],78,864,22,white,'left');text(copy[3],1520,839,14,muted,'right');
const colors=['#7fddbb',amber,'#c7b4f0'];['Operating','Planning / study','Illustrative'].forEach((s,i)=>{oval(72+i*200,154,4,4,colors[i],null);text(s,85+i*200,159,15,muted,'left',400)});c.fillStyle=amber;c.fillRect(0,896,1600*t/30,4);
}
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,position=0,previous=performance.now();
const play=document.getElementById('play'),seek=document.getElementById('seek');
function sync(){play.textContent=playing?'Pause':'Play';seek.value=position;document.getElementById('time').textContent=`${Math.floor(position)} / 30s`}
play.onclick=()=>{if(position>=30)position=0;playing=!playing;sync()};document.getElementById('restart').onclick=()=>{position=0;playing=true;sync()};seek.oninput=()=>{position=Number(seek.value);draw(position);sync()};
function tick(now){if(playing){position=Math.min(30,position+(now-previous)/1000);if(position>=30)playing=false}previous=now;draw(position);sync();requestAnimationFrame(tick)}
window.renderFrame=t=>{playing=false;position=t;draw(t);sync()};draw(0);sync();requestAnimationFrame(tick);
</script></body></html>
